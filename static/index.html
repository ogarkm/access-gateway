<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Access Gate</title>
<style>
:root{color-scheme:dark;--bg:#020305;--surface:#080c12;--panel:rgba(9,13,20,.94);--border:rgba(255,255,255,.07);--text:#e4e9ef;--muted:#788593;--accent:#808aa8;--good:#3dcf82;--danger:#e05252;--warn:#f0a83d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{display:grid;place-items:center;padding:28px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background:radial-gradient(circle at 10% 10%,rgba(92,110,210,.12),transparent 35%),radial-gradient(circle at 90% 90%,rgba(72,78,170,.10),transparent 32%)}
.shell,#launchpad{position:relative;z-index:1;width:min(100%,460px)}
.shell{background:var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.65);padding:30px}
.badge{display:inline-flex;align-items:center;gap:8px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:rgba(124,131,255,.08);border:1px solid rgba(124,131,255,.18);border-radius:999px;padding:6px 12px}
.dot{width:6px;height:6px;border-radius:999px;background:currentColor;box-shadow:0 0 8px currentColor}
h1{font-size:31px;letter-spacing:-.04em;margin-top:18px}
.sub{margin-top:9px;color:var(--muted);line-height:1.55;font:13px ui-monospace,SFMono-Regular,Menlo,monospace}
.divider{height:1px;background:var(--border);margin:25px 0}
label{display:block;color:var(--muted);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
.field{display:flex;gap:9px}input{min-width:0;flex:1;height:50px;background:#05080d;border:1px solid #2a3541;border-radius:13px;color:var(--text);padding:0 15px;font:16px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;outline:none}
input:focus{border-color:rgba(124,131,255,.5)}
button{border:0;border-radius:13px;height:50px;padding:0 18px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.status{min-height:22px;margin-top:11px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.error{color:var(--danger)}.good{color:var(--good)}.muted{color:var(--muted)}
.footer{margin-top:18px;color:#44505e;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;justify-content:space-between}
#launchpad{display:none}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}.eyebrow{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--good);letter-spacing:.12em;text-transform:uppercase}.title{font-size:29px;font-weight:800;letter-spacing:-.04em;margin-top:4px}
.sync{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);text-align:right}
.grid{display:grid;gap:12px}
.tile{display:flex;gap:15px;align-items:center;text-align:left;width:100%;height:auto;padding:18px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid var(--border);border-radius:18px;cursor:pointer;transition:.2s}
.tile:hover{transform:translateY(-3px);border-color:rgba(124,131,255,.28);box-shadow:0 18px 42px rgba(0,0,0,.27)}
.icon{width:48px;height:48px;display:grid;place-items:center;border-radius:13px;font-weight:800;flex:0 0 48px}
.name{font-weight:750}.desc{margin-top:4px;color:var(--muted);font-size:12px}.dep{display:inline-block;margin-left:8px;color:var(--warn);font:10px ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,18px);opacity:0;pointer-events:none;transition:.25s;z-index:10;width:min(390px,calc(100vw - 32px));padding:13px 15px;border:1px solid var(--border);border-radius:14px;background:rgba(9,13,19,.92);box-shadow:0 18px 50px rgba(0,0,0,.45)}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast b{display:block;font-size:13px}.toast span{display:block;margin-top:3px;color:var(--muted);font-size:12px}
@media(max-width:520px){body{padding:16px}.shell{padding:23px}.field{flex-direction:column}.field button{width:100%}}
</style>
</head>
<body>
<main id="gate" class="shell">
  <div class="badge"><span class="dot"></span> Access Gate</div>
  <h1>Enter Access Code</h1>
  <p class="sub">One-time authorization. This client syncs its launchpad registry directly from the Access Gate API.</p>
  <div class="divider"></div>
  <label for="code">One-time code</label>
  <div class="field">
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="••••••">
    <button id="unlock">Unlock</button>
  </div>
  <div id="status" class="status"></div>
  <div class="footer"><span>↵ Enter</span><span>7-day local session</span></div>
</main>

<section id="launchpad">
  <div class="head">
    <div><div class="eyebrow">● Session Active</div><div class="title">Launchpad</div></div>
    <div id="syncStatus" class="sync">Syncing…</div>
  </div>
  <div id="grid" class="grid"></div>
</section>

<div id="toast" class="toast"><b id="toastTitle"></b><span id="toastSub"></span></div>

<script>
const API_BASE = "https://access-gateway-87wc.onrender.com";
const SITES_KEY = "access_gate_sites_v1";
const SITES_SYNC_KEY = "access_gate_sites_synced_at";
const AUTH_KEY = "authorized";
const AUTH_TIME_KEY = "authorized_at";
const AUTH_TTL_MS = 1000 * 60 * 60 * 24 * 7;

const gate = document.getElementById("gate");
const launchpad = document.getElementById("launchpad");
const codeInput = document.getElementById("code");
const unlockBtn = document.getElementById("unlock");
const status = document.getElementById("status");
const grid = document.getElementById("grid");
const syncStatus = document.getElementById("syncStatus");
const toast = document.getElementById("toast");
const toastTitle = document.getElementById("toastTitle");
const toastSub = document.getElementById("toastSub");

function showToast(title, sub) {
  toastTitle.textContent = title;
  toastSub.textContent = sub;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 3200);
}

function validAuth() {
  return localStorage.getItem(AUTH_KEY) === "true" &&
    Date.now() - Number(localStorage.getItem(AUTH_TIME_KEY) || 0) < AUTH_TTL_MS;
}

function getCachedSites() {
  try {
    const value = JSON.parse(localStorage.getItem(SITES_KEY) || "null");
    return Array.isArray(value) ? value : [];
  } catch {
    return [];
  }
}

function saveSites(sites) {
  localStorage.setItem(SITES_KEY, JSON.stringify(sites));
  localStorage.setItem(SITES_SYNC_KEY, String(Date.now()));
}

async function syncSites() {
  try {
    const response = await fetch(`${API_BASE}/api/sites`, {
        cache: "no-store"
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const payload = await response.json();
    if (!Array.isArray(payload.sites)) throw new Error("Invalid registry");
    saveSites(payload.sites);
    syncStatus.textContent = "Synced just now";
    return payload.sites;
  } catch {
    const cached = getCachedSites();
    const ts = Number(localStorage.getItem(SITES_SYNC_KEY) || 0);
    syncStatus.textContent = cached.length
      ? "Offline • cached " + (ts ? new Date(ts).toLocaleDateString() : "")
      : "Offline • no cache";
    return cached;
  }
}

function openInBlank(url, name, title) {
  const win = window.open(
    "about:blank",
    name,
    "popup=1,width=1280,height=720,menubar=no,toolbar=no,location=no,status=no"
  );
  if (!win) {
    showToast("Popup blocked", "Allow popups for this file and try again.");
    return false;
  }
  const safeTitle = String(title).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
  win.document.open();
  win.document.write(
    "<!doctype html><html><head><meta charset='utf-8'><title>" + safeTitle +
    "</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head>" +
    "<body><iframe src='" + String(url).replace(/'/g, "&#39;") +
    "' allow='autoplay; fullscreen; picture-in-picture' allowfullscreen></iframe></body></html>"
  );
  win.document.close();
  try { win.focus(); } catch {}
  return true;
}

function buildGrid(sites) {
  grid.innerHTML = "";
  if (!sites.length) {
    const empty = document.createElement("div");
    empty.className = "tile";
    empty.innerHTML = "<div><div class='name'>No sites available</div><div class='desc'>The backend registry could not be loaded yet.</div></div>";
    grid.appendChild(empty);
    return;
  }
  for (const site of sites) {
    const tile = document.createElement("button");
    tile.className = "tile";
    const icon = document.createElement("div");
    icon.className = "icon";
    icon.style.background = String(site.color || "#808aa8") + "18";
    icon.style.color = site.color || "#808aa8";
    icon.textContent = site.icon || site.name?.slice(0, 1) || "?";
    const copy = document.createElement("div");
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = site.name || "Unnamed";
    if (site.deprecated) {
      const dep = document.createElement("span");
      dep.className = "dep";
      dep.textContent = "Deprecated";
      name.appendChild(dep);
    }
    const desc = document.createElement("div");
    desc.className = "desc";
    desc.textContent = site.desc || "";
    copy.append(name, desc);
    tile.append(icon, copy);
    tile.addEventListener("click", () => {
      if (openInBlank(site.url, "AccessGateway_" + String(site.name).replace(/[^a-zA-Z0-9_-]/g, "_"), site.name)) {
        showToast(site.name + " opened", "Running in a new about:blank window.");
      }
    });
    grid.appendChild(tile);
  }
}

async function showLaunchpad() {
  gate.style.display = "none";
  launchpad.style.display = "block";
  const cached = getCachedSites();
  buildGrid(cached);
  const fresh = await syncSites();
  buildGrid(fresh);
}

async function submitCode() {
  const code = codeInput.value.trim();
  if (!code) return;
  unlockBtn.disabled = true;
  status.textContent = "Verifying…";
  status.className = "status muted";
  try {
    const response = await fetch(`${API_BASE}/auth/validate`, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ code })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.success) throw new Error(data.detail || "Invalid code");
    localStorage.setItem(AUTH_KEY, "true");
    localStorage.setItem(AUTH_TIME_KEY, String(Date.now()));
    showLaunchpad();
  } catch {
    status.textContent = "Invalid or expired code.";
    status.className = "status error";
    codeInput.value = "";
    codeInput.focus();
  } finally {
    unlockBtn.disabled = false;
  }
}

unlockBtn.addEventListener("click", submitCode);
codeInput.addEventListener("keydown", e => { if (e.key === "Enter") submitCode(); });

if (validAuth()) showLaunchpad();
</script>
</body>
</html>
