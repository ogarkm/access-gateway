<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Gate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#020305;--surface:#06090d;--panel:rgba(7,10,15,.94);--border:rgba(255,255,255,.06);--text:#d7e0eb;--muted:#667381;--muted2:#293642;--accent:#808aa8;--danger:#e05252;--good:#3dcf82;--warn:#f0a83d;--mono:"JetBrains Mono",monospace;--display:"Syne",sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;background:var(--bg);color:var(--text);font-family:var(--display);overflow:hidden}
    body{display:grid;place-items:center;padding:24px}.blob{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}.b1{width:500px;height:500px;background:radial-gradient(circle,rgba(92,110,210,.16),transparent 70%);top:-120px;left:-100px}.b2{width:400px;height:400px;background:radial-gradient(circle,rgba(72,78,170,.1),transparent 70%);bottom:-100px;right:-80px}
    .shell,#launchpad,#dead{position:relative;z-index:1}.shell{width:min(100%,420px);background:var(--panel);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(24px);box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden}.shell:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(124,131,255,.5),transparent)}
    .header{padding:28px 28px 0}.badge{display:inline-flex;align-items:center;gap:7px;font:400 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:rgba(124,131,255,.08);border:1px solid rgba(124,131,255,.18);border-radius:999px;padding:4px 12px;margin-bottom:18px}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent)}h1{font-size:1.9rem;font-weight:800;letter-spacing:-.03em}.subtitle{margin-top:8px;font:300 .8rem/1.6 var(--mono);color:var(--muted)}.divider{margin:24px 28px 0;height:1px;background:var(--border)}.body{padding:22px 28px 28px}.label{font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.field{display:flex;gap:8px}input{flex:1;height:50px;background:rgba(5,8,14,.7);border:1px solid var(--muted2);border-radius:13px;color:var(--text);font:1rem var(--mono);letter-spacing:.15em;padding:0 16px;outline:none}input:focus{border-color:rgba(124,131,255,.5)}button{font-family:var(--display);cursor:pointer}.unlock{height:50px;padding:0 20px;border:0;border-radius:13px;background:var(--accent);color:#fff;font-size:.88rem;font-weight:700}.status{margin-top:12px;min-height:20px;font:.76rem var(--mono)}.error{color:var(--danger)}.footer{padding:0 28px 20px;font:.68rem var(--mono);color:var(--muted2);display:flex;justify-content:space-between}
    #launchpad{display:none;width:min(100%,460px)}.lphead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}.eyebrow{font:400 .66rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;display:flex;gap:7px;align-items:center}.lptitle{font-size:1.7rem;font-weight:800;letter-spacing:-.04em}.grid{display:grid;gap:12px}.tile{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.035),rgba(255,255,255,.012)),var(--panel);border:1px solid rgba(255,255,255,.065);border-radius:18px;padding:20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:.2s;box-shadow:0 12px 30px rgba(0,0,0,.18)}.tile:hover{transform:translateY(-4px);border-color:rgba(124,131,255,.28)}.icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.35rem;font-weight:800;flex:0 0 48px}.name{font-size:.95rem;font-weight:700}.desc{font:300 .7rem var(--mono);color:var(--muted);margin-top:4px}.dep{display:inline-block;margin-left:8px;padding:2px 6px;border:1px solid rgba(240,168,61,.22);border-radius:6px;color:var(--warn);font:500 .58rem var(--mono);text-transform:uppercase;letter-spacing:.06em}
    .toast{position:fixed;left:50%;bottom:28px;z-index:10;width:min(390px,calc(100vw - 32px));padding:13px 15px;display:flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(9,13,19,.88);backdrop-filter:blur(22px);box-shadow:0 18px 50px rgba(0,0,0,.42);opacity:0;pointer-events:none;transform:translate(-50%,14px);transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.ti{width:31px;height:31px;display:grid;place-items:center;border:1px solid rgba(61,207,130,.2);border-radius:10px;color:var(--good)}.tt{font-size:.8rem;font-weight:700}.ts{font:300 .67rem var(--mono);color:var(--muted);margin-top:2px}
    #dead{display:none;text-align:center}.deadicon{width:52px;height:52px;margin:0 auto 20px;border-radius:16px;display:grid;place-items:center;background:rgba(224,82,82,.1);color:var(--danger);font-size:1.3rem}.deadtitle{font-size:1.2rem;font-weight:800;margin-bottom:8px}.deadsub{font:300 .75rem/1.65 var(--mono);color:var(--muted)}
  </style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>
  <main class="shell" id="gate">
    <div class="header"><div class="badge"><span class="dot"></span> Secure Gate</div><h1>Access Gate</h1><p class="subtitle">Enter code to unlock.</p></div>
    <div class="divider"></div>
    <section class="body"><div class="label">One-time code</div><div class="field"><input id="code" inputmode="numeric" maxlength="10" autocomplete="one-time-code" placeholder="••••••••••"/><button id="unlock" class="unlock">Unlock</button></div><div id="status" class="status"></div></section>
    <div class="footer"><span>Press ↵</span><span>7-day session</span></div>
  </main>

  <section id="launchpad"><div class="lphead"><div><div class="eyebrow"><span class="dot"></span> Session Active</div><div class="lptitle">Launchpad</div></div></div><div class="grid" id="grid"></div></section>
  <section id="dead"><div class="deadicon">!</div><div class="deadtitle">Session Ended</div><div class="deadsub">This tab is now dormant.<br/>You can safely close it.</div></section>
  <div class="toast" id="toast"><div class="ti">✓</div><div><div class="tt" id="toastTitle">Opened</div><div class="ts" id="toastSub">The site is running in a new window.</div></div></div>

<script>
  const AUTH_KEY="authorized", AUTH_TIME_KEY="authorized_at", AUTH_TTL_MS=1000*60*60*24*7;
  const gate=document.getElementById("gate"), launchpad=document.getElementById("launchpad"), dead=document.getElementById("dead");
  const code=document.getElementById("code"), unlock=document.getElementById("unlock"), status=document.getElementById("status"), grid=document.getElementById("grid");
  const toast=document.getElementById("toast"), toastTitle=document.getElementById("toastTitle"), toastSub=document.getElementById("toastSub"); let toastTimer;

  function showToast(title,sub,good=true){toastTitle.textContent=title;toastSub.textContent=sub;toast.querySelector(".ti").textContent=good?"✓":"!";toast.querySelector(".ti").style.color=good?"var(--good)":"var(--warn)";toast.classList.remove("show");clearTimeout(toastTimer);requestAnimationFrame(()=>toast.classList.add("show"));toastTimer=setTimeout(()=>toast.classList.remove("show"),3200)}
  function openInBlank(url,name,title){const win=window.open("about:blank",name,"popup=1,width=1280,height=720,menubar=no,toolbar=no,location=no,status=no");if(!win){showToast("Popup blocked","Allow popups for this site, then try again.",false);return false}const safe=String(title).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");win.document.open();win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+safe+'</title><style>html,body{margin:0;height:100%;background:#000;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe src="'+url.replace(/"/g,"&quot;")+'" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></body></html>');win.document.close();try{win.focus()}catch(_){}return true}
  async function loadSites(){const r=await fetch("/api/sites",{cache:"no-store"});if(!r.ok)throw new Error("site registry unavailable");const d=await r.json();return d.sites||[]}
  async function buildGrid(){grid.innerHTML="";const sites=await loadSites();for(const site of sites){const tile=document.createElement("div");tile.className="tile";tile.innerHTML='<div class="icon" style="background:'+site.color+'18;color:'+site.color+'">'+(site.icon||"•")+'</div><div><div class="name">'+escapeHtml(site.name)+(site.deprecated?'<span class="dep">Deprecated</span>':"")+'</div><div class="desc">'+escapeHtml(site.desc||"")+'</div></div>';tile.addEventListener("click",()=>{if(openInBlank(site.url,"AccessGateway_"+site.name.replace(/[^a-zA-Z0-9_-]/g,"_"),site.name))showToast(site.name+" opened","The site is running in a new window.")});grid.appendChild(tile)}}
  function escapeHtml(v){const d=document.createElement("div");d.textContent=String(v??"");return d.innerHTML}
  async function showLaunchpad(){gate.style.display="none";try{await buildGrid();launchpad.style.display="block";document.querySelector(".b1").style.background="radial-gradient(circle, rgba(20,100,60,.18), transparent 70%)"}catch(e){status.textContent="Unable to load the latest site list.";status.className="status error";gate.style.display="block"}}
  async function submitCode(){const value=code.value.trim();if(!value)return;unlock.disabled=true;status.textContent="Verifying…";status.className="status";try{const r=await fetch("/auth/validate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:value})});const d=await r.json();if(r.ok&&d.success){localStorage.setItem(AUTH_KEY,"true");localStorage.setItem(AUTH_TIME_KEY,String(Date.now()));await showLaunchpad()}else throw new Error()}catch{status.textContent="Invalid code.";status.className="status error";code.value=""}finally{unlock.disabled=false}}
  function hasValidAuth(){const a=localStorage.getItem(AUTH_KEY)==="true",ts=Number(localStorage.getItem(AUTH_TIME_KEY)||"0");return a&&Date.now()-ts<AUTH_TTL_MS}
  unlock.addEventListener("click",submitCode);code.addEventListener("keydown",e=>{if(e.key==="Enter")submitCode()});
  if(hasValidAuth())showLaunchpad();
  setInterval(()=>{if(!hasValidAuth()&&launchpad.style.display==="block"){launchpad.style.display="none";dead.style.display="block"}},30000);
</script>
</body>
</html>
